name: CI/CD - OS Service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore OsService.sln

      - name: Build
        run: dotnet build OsService.sln --no-restore -c Release

      - name: Test (com coleta de cobertura)
        run: >
          dotnet test OsService.sln --no-build -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Resumo de cobertura (Domain + Application)
        env:
          COVERAGE_MIN: "0"
        run: |
          python3 - <<'PY'
          import glob, os, sys
          import xml.etree.ElementTree as ET
          files = glob.glob("coverage/**/coverage.cobertura.xml", recursive=True)
          tot = {"all": [0, 0], "core": [0, 0]}
          for f in files:
              for pkg in ET.parse(f).getroot().iter("package"):
                  name = pkg.get("name", "")
                  for cls in pkg.iter("class"):
                      for ln in cls.iter("line"):
                          hit = 1 if int(ln.get("hits", "0")) > 0 else 0
                          tot["all"][0] += hit; tot["all"][1] += 1
                          if ".Domain" in name or ".Application" in name:
                              tot["core"][0] += hit; tot["core"][1] += 1
              if len(files) > 1: break
          pct = lambda k: 100.0 * tot[k][0] / tot[k][1] if tot[k][1] else 0.0
          print(f"Cobertura de linhas - total: {pct('all'):.1f}% ({tot['all'][0]}/{tot['all'][1]})")
          print(f"Cobertura de linhas - Domain+Application: {pct('core'):.1f}% ({tot['core'][0]}/{tot['core'][1]})")
          minimo = float(os.environ.get("COVERAGE_MIN", "0"))
          if pct("core") < minimo:
              print(f"::error::Cobertura {pct('core'):.1f}% abaixo do minimo {minimo}%")
              sys.exit(1)
          PY

      # Quality gate — SonarQube/SonarCloud analisa o código e falha o pipeline
      # se a cobertura ficar abaixo de 80% ou se novas issues críticas forem
      # introduzidas. Requer os secrets SONAR_TOKEN e SONAR_HOST_URL (ou
      # SONAR_ORGANIZATION/SONAR_PROJECT_KEY para SonarCloud) configurados no
      # repositório — enquanto não configurados, este passo é pulado.
      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          args: >
            -Dsonar.projectKey=oficina-wagyu-os-service
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.cs.opencover.reportsPaths=coverage/**/coverage.opencover.xml
            -Dsonar.coverage.exclusions=**/Migrations/**

  deploy:
    name: Deploy no Kubernetes (K3s/EC2)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t oficina-os-service:latest .

      - name: Salva a imagem e envia para a EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          docker save oficina-os-service:latest | gzip | \
            ssh -i ~/.ssh/id_rsa ubuntu@"$EC2_HOST" \
            "sudo k3s ctr images import -"

      - name: Aplica os manifestos e reinicia o Deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          scp -i ~/.ssh/id_rsa -r k8s ubuntu@"$EC2_HOST":/tmp/os-service-k8s

          ssh -i ~/.ssh/id_rsa ubuntu@"$EC2_HOST" '
            sudo kubectl apply -f /tmp/os-service-k8s/00-namespace.yaml &&
            sudo kubectl apply -f /tmp/os-service-k8s/01-configmap.yaml &&
            sudo kubectl apply -f /tmp/os-service-k8s/03-os-service-deployment.yaml &&
            sudo kubectl apply -f /tmp/os-service-k8s/04-hpa.yaml &&
            sudo kubectl rollout restart deployment/os-service -n oficina-os-service &&
            sudo kubectl rollout status deployment/os-service -n oficina-os-service --timeout=120s
          '
