# Exemplo de formato do Secret — NUNCA commitar valores reais.
# Criação real:
#
# kubectl create secret generic os-service-secret -n oficina-os-service \
#   --from-literal=ConnectionStrings__DefaultConnection='...' \
#   --from-literal=Jwt__Secret='...' \
#   --from-literal=Messaging__SnsTopicArn='arn:aws:sns:us-east-1:...:oficina-wagyu-saga-events' \
#   --from-literal=EmailWebhook__Secret='...'
#
apiVersion: v1
kind: Secret
metadata:
  name: os-service-secret
  namespace: oficina-os-service
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "COLE_AQUI_A_CONNECTION_STRING_DO_RDS"
  Jwt__Secret: "COLE_AQUI_O_MESMO_SEGREDO_USADO_PELA_LAMBDA_DE_AUTH"
  Messaging__SnsTopicArn: "arn:aws:sns:us-east-1:<account-id>:oficina-wagyu-saga-events"
  EmailWebhook__Secret: "COLE_AQUI_O_MESMO_SEGREDO_DO_WEBHOOK_DE_EMAIL"
